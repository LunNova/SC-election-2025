name: "Email test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: |
        scripts/send-email.sh "elections@nixos.org" "Test email please ignore" <<EOF
        This is a test email sent by a silly workflow.
        EOF
